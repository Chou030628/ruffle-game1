<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>盟军战争英雄：1944 进阶版</title>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        ruffle-player {
            width: 100%;
            height: 100%;
        }
    </style>

    <!-- 本地自托管的 Ruffle -->
    <script src="./ruffle/ruffle.js"></script>

    <!-- 百度统计 -->
    <script>
        var _hmt = _hmt || [];

        (function () {
            var hm = document.createElement("script");

            hm.src =
                "https://hm.baidu.com/hm.js?b1e1c2a42e540fa7a8962cca3ec8e1ad";

            var s = document.getElementsByTagName("script")[0];

            s.parentNode.insertBefore(hm, s);
        })();
    </script>
</head>

<body>
    <div id="game-container"></div>

    <script>
        window.addEventListener("DOMContentLoaded", function () {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();

            document
                .getElementById("game-container")
                .appendChild(player);

            player.ruffle().load({
                url: "./game.swf",
                autoplay: "on",
                unmuteOverlay: "visible",
                scale: "showAll",
                letterbox: "on",
                playerVersion: 12,

                deviceFontRenderer: "canvas",

                defaultFonts: {
                    sans: [
                        "Microsoft YaHei",
                        "SimSun",
                        "Noto Sans CJK SC",
                        "Arial"
                    ],

                    serif: [
                        "SimSun",
                        "Microsoft YaHei"
                    ],

                    typewriter: [
                        "Microsoft YaHei",
                        "SimSun"
                    ]
                }
            });
        });
    </script>
</body>
</html>
