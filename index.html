<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>游戏字体测试</title>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        ruffle-player {
            width: 100%;
            height: 100%;
        }
    </style>

    <script src="./ruffle/ruffle.js"></script>
</head>

<body>
    <div id="game-container"></div>

    <script>
        window.addEventListener("DOMContentLoaded", function () {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();

            document
                .getElementById("game-container")
                .appendChild(player);

            player.ruffle().load({
                url: "./game.swf",
                autoplay: "on",
                unmuteOverlay: "visible",
                scale: "showAll",
                letterbox: "on",
                playerVersion: 12,

                deviceFontRenderer: "canvas",

                defaultFonts: {
                    sans: [
                        "Microsoft YaHei",
                        "SimSun",
                        "Noto Sans CJK SC",
                        "Arial"
                    ],
                    serif: [
                        "SimSun",
                        "Microsoft YaHei"
                    ],
                    typewriter: [
                        "Microsoft YaHei",
                        "SimSun"
                    ]
                }
            });
        });
    </script>
</body>
</html>
