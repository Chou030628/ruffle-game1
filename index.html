<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>盟军战争英雄：1944 终极版</title>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        #loading-message,
        #error-message {
            color: #fff;
            font-family:
                "Microsoft YaHei",
                "Noto Sans CJK SC",
                Arial,
                sans-serif;
            text-align: center;
            line-height: 1.8;
            padding: 30px;
        }

        #loading-message {
            font-size: 20px;
        }

        #error-message {
            font-size: 18px;
        }

        ruffle-player {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>

    <!-- 本地自托管的 Ruffle -->
    <script src="./ruffle/ruffle.js"></script>
</head>

<body>
    <div id="game-container">
        <div id="loading-message">
            游戏正在加载，请稍候……<br>
            首次加载需要下载约 36 MB 的游戏文件
        </div>
    </div>

    <script>
        window.addEventListener("DOMContentLoaded", async function () {
            const container =
                document.getElementById("game-container");

            async function downloadSwf(maxAttempts = 5) {
                let lastError = null;

                /*
                * 使用固定版本地址。
                * 只有真正更换 SWF 文件时，才修改版本号。
                */
                const swfUrl = new URL(
                    "./game_v2.swf",
                    window.location.href
                );

                swfUrl.searchParams.set(
                    "v",
                    "20260805-3"
                );

                for (
                    let attempt = 1;
                    attempt <= maxAttempts;
                    attempt++
                ) {
                    const loadingMessage =
                        document.getElementById(
                            "loading-message"
                        );

                    if (loadingMessage) {
                        loadingMessage.innerHTML =
                            "游戏正在加载，请稍候……<br>" +
                            "正在下载游戏文件：" +
                            attempt +
                            " / " +
                            maxAttempts;
                    }

                    try {
                        /*
                        * 第一次优先使用浏览器中的完整缓存。
                        * 失败后重新从服务器下载，并更新缓存。
                        */
                        const response = await fetch(
                            swfUrl,
                            {
                                method: "GET",
                                cache:
                                    attempt === 1
                                        ? "force-cache"
                                        : "reload"
                            }
                        );

                        if (!response.ok) {
                            throw new Error(
                                "HTTP 状态码：" +
                                response.status
                            );
                        }

                        const data =
                            await response.arrayBuffer();

                        if (data.byteLength < 8) {
                            throw new Error(
                                "文件过短，仅有 " +
                                data.byteLength +
                                " 字节"
                            );
                        }

                        /*
                        * 检查服务器是否只返回了部分文件。
                        */
                        const contentRange =
                            response.headers.get(
                                "content-range"
                            );

                        if (contentRange) {
                            const match =
                                contentRange.match(
                                    /bytes\s+(\d+)-(\d+)\/(\d+)/i
                                );

                            if (match) {
                                const start =
                                    Number(match[1]);

                                const end =
                                    Number(match[2]);

                                const total =
                                    Number(match[3]);

                                const rangeLength =
                                    end - start + 1;

                                if (
                                    start !== 0 ||
                                    rangeLength !==
                                        data.byteLength ||
                                    end + 1 !== total
                                ) {
                                    throw new Error(
                                        "服务器返回了不完整文件：" +
                                        contentRange
                                    );
                                }
                            }
                        }

                        /*
                        * 检查 SWF 文件头。
                        */
                        const bytes =
                            new Uint8Array(data, 0, 3);

                        const signature =
                            String.fromCharCode(
                                bytes[0],
                                bytes[1],
                                bytes[2]
                            );

                        if (
                            signature !== "FWS" &&
                            signature !== "CWS" &&
                            signature !== "ZWS"
                        ) {
                            throw new Error(
                                "文件头不是合法 SWF：" +
                                JSON.stringify(signature)
                            );
                        }

                        return data;
                    } catch (error) {
                        lastError = error;

                        console.warn(
                            "第 " +
                            attempt +
                            " 次下载失败：",
                            error
                        );

                        /*
                        * 每次失败后稍等一会儿再重试。
                        */
                        if (attempt < maxAttempts) {
                            const waitTime =
                                Math.min(
                                    attempt * 1500,
                                    5000
                                );

                            await new Promise(function (
                                resolve
                            ) {
                                setTimeout(
                                    resolve,
                                    waitTime
                                );
                            });
                        }
                    }
                }

                throw lastError ||
                    new Error("游戏文件下载失败");
            }

            try {
                const swfData = await downloadSwf();

                const ruffle =
                    window.RufflePlayer.newest();

                const player =
                    ruffle.createPlayer();

                container.innerHTML = "";
                container.appendChild(player);

                await player.ruffle().load({
                    /*
                     * 使用完整下载后的二进制数据，
                     * 不再让 Ruffle 自己分段请求 SWF。
                     */
                    data: new Uint8Array(swfData),

                    swfFileName: "game_v2.swf",

                    /*
                     * 让游戏内部相对路径仍然以网站根目录为准。
                     */
                    base: new URL(
                        "./",
                        window.location.href
                    ).href,

                    autoplay: "on",
                    unmuteOverlay: "visible",
                    scale: "showAll",
                    letterbox: "on",
                    playerVersion: 12,

                    deviceFontRenderer: "canvas",

                    defaultFonts: {
                        sans: [
                            "Microsoft YaHei",
                            "SimSun",
                            "Noto Sans CJK SC",
                            "Arial"
                        ],

                        serif: [
                            "SimSun",
                            "Microsoft YaHei"
                        ],

                        typewriter: [
                            "Microsoft YaHei",
                            "SimSun"
                        ]
                    }
                });
            } catch (error) {
                console.error(
                    "游戏最终加载失败：",
                    error
                );

                container.innerHTML =
                    '<div id="error-message">' +
                    "游戏文件加载失败。" +
                    "<br><br>" +
                    String(error.message || error) +
                    "<br><br>" +
                    '<button id="retry-button" ' +
                    'style="' +
                    "font-size:18px;" +
                    "padding:10px 24px;" +
                    "cursor:pointer;" +
                    '">' +
                    "重新加载" +
                    "</button>" +
                    "</div>";

                document
                    .getElementById("retry-button")
                    .addEventListener(
                        "click",
                        function () {
                            window.location.reload();
                        }
                    );
            }
        });
    </script>

    <!-- 百度统计 -->

            s.parentNode.insertBefore(hm, s);

    </script>
</body>
</html>
